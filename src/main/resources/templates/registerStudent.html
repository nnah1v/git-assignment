<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生登録</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    h1 {
        margin-bottom: 24px;
    }

    .form-row {
        margin-bottom: 12px;
    }

    label {
        display: inline-block;
        width: 140px;
    }

    input,
    select {
        width: 260px;
        height: 32px;
        box-sizing: border-box;
    }

    button {
        margin-left: 140px;
        padding: 8px 24px;
    }
  </style>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
<div>
  <label for="name">名前:</label>
  <input type="text" id="name" th:field="*{student.name}" repuired/>
</div>

    <div>
      <label for="furigana">ふりがな：</label>
      <input type="text"
             id="furigana"
             th:field="*{student.furigana}"
             required>
    </div>

    <div>
      <label for="nickname">ニックネーム：</label>
      <input type="text"
             id="nickname"
             th:field="*{student.nickname}">
    </div>

    <div>
      <label for="email">メールアドレス：</label>
      <input type="email"
             id="email"
             th:field="*{student.email}"
             required>
    </div>

    <div>
      <label for="city">地域：</label>
      <input type="text"
             id="city"
             th:field="*{student.city}">
    </div>

  <div>
    <label for="age">年齢：</label>
    <input type="number"
           id="age"
           th:field="*{student.age}"
           min="0"
           required>
  </div>

  <div>
    <label for="gender">性別：</label>
    <select id="gender"
            th:field="*{student.gender}"
            required>
      <option value="">選択してください</option>
      <option value="男性">男性</option>
      <option value="女性">女性</option>
      <option value="その他">その他</option>
    </select>
  </div>

  <div th:each="course, stat : *{studentCourses}">

    <div class="form-row">
      <label>コース名：</label>
      <select th:field="*{studentCourses[__${stat.index}__].courseName}"
              required>
        <option value="">選択してください</option>
        <option value="Java基礎">Java基礎</option>
        <option value="webデザイン">webデザイン</option>
        <option value="Java応用">Java応用</option>
        <option value="AWS">AWS</option>
      </select>
    </div>

  </div>



  <div>
  <button type="submit">登録</button>
</div>
</form>

</body>
</html>
